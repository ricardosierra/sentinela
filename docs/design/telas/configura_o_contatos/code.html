<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>

<title>Sentinela - Configuração de Contatos</title>

                    "surface-container": "#152031",

                    "on-error-container": "#ffdad6",
                    "primary": "#adc6ff",
                    "tertiary-fixed": "#dae2fd",
                    "surface-container-lowest": "#040e1f",
                    "background": "#081425",
                    "surface-dim": "#081425",
                    "surface-container-highest": "#2a3548",
                    "surface-bright": "#2f3a4c",
                    "on-secondary-fixed-variant": "#38485d",
                    "surface": "#081425",
                    "primary-container": "#4d8eff",
                    "tertiary-container": "#8990a8",
                    "on-tertiary-fixed": "#131b2e",
                    "error-container": "#93000a",
                    "on-secondary-container": "#a9bad3",
                    "on-primary-fixed": "#001a42",
                    "surface-variant": "#2a3548",
                    "tertiary": "#bec6e0",
                    "error": "#ffb4ab",
                    "surface-container-low": "#111c2d",

                    "secondary-container": "#3a4a5f",

                    "inverse-on-surface": "#263143",
                    "inverse-surface": "#d8e3fb",
                    "tertiary-fixed-dim": "#bec6e0",
                    "primary-fixed": "#d8e2ff",
                    "outline-variant": "#424754",
                    "outline": "#8c909f",
                    "on-surface": "#d8e3fb",
                    "surface-tint": "#adc6ff",
                    "primary-fixed-dim": "#adc6ff",
                    "on-tertiary": "#283044",
                    "on-secondary-fixed": "#0b1c30",
                    "on-surface-variant": "#c2c6d6",

<style>
        body {
            background-color: #081425;
            color: #d8e3fb;
            -webkit-tap-highlight-color: transparent;
        }
        .option-card.active {
            background-color: #3a4a5f;
            border-color: #adc6ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .step-progress {
            background: linear-gradient(90deg, #adc6ff 50%, #2a3548 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md overflow-x-hidden">
<!-- TopAppBar Mock (Immutable Casing) -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl flex justify-between items-center h-16 px-margin-mobile">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="shield">shield</span>
<span class="font-headline-md text-headline-md font-bold text-primary">Sentinela</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="person">person</span>
</div>
</header>
<main class="min-h-screen pt-24 pb-32 px-margin-mobile max-w-md mx-auto flex flex-col justify-between">
<!-- Header Section -->
<section class="space-y-md animate-fade-in">
<div class="flex items-center justify-between mb-lg">
<span class="font-label-lg text-label-lg text-primary uppercase tracking-widest">Passo 2 de 4</span>
<div class="h-1.5 w-32 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/2 rounded-full"></div>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface leading-tight">E as pessoas da sua lista de contatos?</h1>
<p class="text-on-surface-variant font-body-lg">Defina como o Sentinela deve tratar as chamadas de quem você já conhece. Você pode alterar isso individualmente depois.</p>
</section>
<!-- Options Bento-like Grid -->
<section class="grid grid-cols-1 gap-md mt-xl" id="options-container">
<!-- Option: Tocar (Padrão) -->
<button class="option-card group relative flex items-center p-md bg-surface-container-low border border-outline-variant rounded-xl transition-all active:scale-95 text-left active" data-value="tocar" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center mr-md group-[.active]:bg-primary-container">
<span class="material-symbols-outlined text-primary group-[.active]:text-on-primary-container" data-icon="notifications_active">notifications_active</span>
</div>
<div class="flex-1">
<div class="flex items-center gap-xs">
<span class="font-title-lg text-title-lg text-on-surface">Tocar</span>
<span class="bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-tighter">Padrão</span>
</div>
<p class="text-on-surface-variant text-label-md">As chamadas tocam normalmente no seu telefone.</p>
</div>
<span class="material-symbols-outlined text-primary opacity-0 group-[.active]:opacity-100 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option: Bloquear -->
<button class="option-card group relative flex items-center p-md bg-surface-container-low border border-outline-variant rounded-xl transition-all active:scale-95 text-left" data-value="bloquear" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center mr-md group-[.active]:bg-primary-container">
<span class="material-symbols-outlined text-on-surface-variant group-[.active]:text-on-primary-container" data-icon="block">block</span>
</div>
<div class="flex-1">
<span class="font-title-lg text-title-lg text-on-surface">Bloquear</span>
<p class="text-on-surface-variant text-label-md">Bloqueia todas as chamadas, enviando para a caixa postal.</p>
</div>
<span class="material-symbols-outlined text-primary opacity-0 group-[.active]:opacity-100 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option: Silenciar -->
<button class="option-card group relative flex items-center p-md bg-surface-container-low border border-outline-variant rounded-xl transition-all active:scale-95 text-left" data-value="silenciar" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center mr-md group-[.active]:bg-primary-container">
<span class="material-symbols-outlined text-on-surface-variant group-[.active]:text-on-primary-container" data-icon="notifications_off">notifications_off</span>
</div>
<div class="flex-1">
<span class="font-title-lg text-title-lg text-on-surface">Silenciar</span>
<p class="text-on-surface-variant text-label-md">O telefone não vibra nem toca, mas mostra a notificação.</p>
</div>
<span class="material-symbols-outlined text-primary opacity-0 group-[.active]:opacity-100 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option: Nunca Silenciar -->
<button class="option-card group relative flex items-center p-md bg-surface-container-low border border-outline-variant rounded-xl transition-all active:scale-95 text-left" data-value="nunca_silenciar" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center mr-md group-[.active]:bg-primary-container">
<span class="material-symbols-outlined text-on-surface-variant group-[.active]:text-on-primary-container" data-icon="priority_high">priority_high</span>
</div>
<div class="flex-1">
<span class="font-title-lg text-title-lg text-on-surface">Nunca Silenciar</span>
<p class="text-on-surface-variant text-label-md">Ignora o modo 'Não Perturbe' para sua lista de contatos.</p>
</div>
<span class="material-symbols-outlined text-primary opacity-0 group-[.active]:opacity-100 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</section>
<!-- Sticky Footer Action -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background to-transparent pt-8">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary text-on-primary py-md rounded-full font-label-lg text-label-lg flex items-center justify-center gap-sm shadow-lg active:scale-95 transition-transform" id="next-button">
<span>Próximo</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
<script>
        function selectOption(element) {
            // Remove active class from all
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // Add to selected
            element.classList.add('active');
            
            // Haptic feedback simulation (logic only)
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        document.getElementById('next-button').addEventListener('click', function() {
            this.classList.add('opacity-80', 'scale-95');
            setTimeout(() => {
                // In a real app, route to Step 3
                console.log('Redirecting to step 3...');
            }, 150);
        });

        // Entrance animations
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.option-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 + (index * 100));
            });
        });
    </script>
</body></html>
