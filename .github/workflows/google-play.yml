name: Publicar na Google Play

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      operation:
        description: "publish envia um AAB novo; promote move o AAB já publicado entre tracks"
        required: true
        default: promote
        type: choice
        options:
          - publish
          - promote
      version:
        description: "Versão SemVer, por exemplo 0.2.2 (deve já existir como tag)"
        required: true
        type: string
      track:
        description: "Canal de destino"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      source_track:
        description: "Track de origem (usado somente em promote)"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Estado da release no canal"
        required: true
        default: DRAFT
        type: choice
        options:
          - DRAFT
          - IN_PROGRESS
          - COMPLETED
          - HALTED
      user_fraction:
        description: "Fração do rollout (ex.: 0.1); usada somente em IN_PROGRESS"
        required: true
        default: "0.1"
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-${{ inputs.track || 'internal' }}
  cancel-in-progress: false

# Ordem deliberada: tag -> CI -> publicação. O passo mais barato reprova
# primeiro, e nada é assinado nem enviado à Play antes de detekt, lint, testes,
# cobertura, build e invariantes passarem sobre ESTE commit.
jobs:
  version:
    name: Validar tag e calcular versionCode
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar tag e calcular versionCode
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Versão inválida: $RELEASE_VERSION (use vX.Y.Z ou X.Y.Z)" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( version_code < 4 )); then
            echo "versionCode calculado precisa ser maior que o valor versionado atual (3)" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "v$version^{commit}")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Execute o workflow sobre a tag v$version; o commit selecionado não corresponde a ela" >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    # `promote` move um AAB JÁ publicado entre tracks — não há código novo para
    # verificar, então esse caminho dispensa a CI (e o job `publish` aceita o
    # resultado `skipped`).
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'publish' }}
    uses: ./.github/workflows/ci.yml

  publish:
    name: Assinar e publicar
    needs: [version, ci]
    # `needs` sozinho pularia a publicação quando a CI é pulada (caminho
    # `promote`). A condição explícita aceita sucesso e pulo da CI, exige
    # sucesso da validação da tag e barra falha e cancelamento.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.ci.result != 'failure' && needs.ci.result != 'cancelled' }}
    runs-on: ubuntu-latest
    # Crie estes Environments no GitHub. "play-production" deve ter revisão
    # obrigatória, para que a publicação pública nunca seja um push acidental.
    environment: play-${{ inputs.track || 'internal' }}
    env:
      PLAY_TRACK: ${{ inputs.track || 'internal' }}
      PLAY_SOURCE_TRACK: ${{ inputs.source_track || 'internal' }}
      PLAY_RELEASE_STATUS: ${{ inputs.release_status || 'DRAFT' }}
      PLAY_USER_FRACTION: ${{ inputs.user_fraction || '0.1' }}
      ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # detekt, lint, testes unitários, gate de cobertura, build debug e
      # `scripts/verify-invariants.sh` já rodaram no job `ci`, sobre este mesmo
      # commit, antes deste job existir. Aqui sobra só o que é específico da
      # loja e não faz sentido cobrar de toda pull request.
      - name: Validar metadados da loja
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
        run: |
          set -euo pipefail
          python3 scripts/verify-locales.py
          python3 scripts/sync-play-metadata.py --check

      - name: Materializar chave de upload
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Secret ausente: $secret_name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > app/keystore.properties
          chmod 600 app/release.keystore app/keystore.properties

      - name: Gerar e verificar artefatos release
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
        env:
          SENTINELA_VERSION_NAME: ${{ needs.version.outputs.name }}
          SENTINELA_VERSION_CODE: ${{ needs.version.outputs.code }}
        # `verify-invariants.sh` saiu daqui de propósito: ele lê o manifest
        # mergeado do DEBUG e os relatórios de detekt e lint, que este job não
        # gera mais — quem os produz, e quem roda o script, é o job `ci`, sobre
        # este mesmo commit. Aqui fica só a verificação do artefato release.
        run: |
          set -euo pipefail
          ./gradlew assembleRelease bundleRelease
          ./scripts/verify-release-artifact.sh

      - name: Gerar metadados para a Play
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
        run: python3 scripts/sync-play-metadata.py

      - name: Publicar bundle, textos e gráficos
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
        env:
          SENTINELA_VERSION_NAME: ${{ needs.version.outputs.name }}
          SENTINELA_VERSION_CODE: ${{ needs.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_PUBLISHER_CREDENTIALS" ]]; then
            echo "Secret ausente: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          publish_args=("-PplayTrack=$PLAY_TRACK" "-PplayReleaseStatus=$PLAY_RELEASE_STATUS")
          if [[ "$PLAY_RELEASE_STATUS" == "IN_PROGRESS" ]]; then
            publish_args+=("-PplayUserFraction=$PLAY_USER_FRACTION")
          fi
          ./gradlew publishReleaseBundle publishReleaseListing "${publish_args[@]}"

      - name: Promover artefato existente
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_PUBLISHER_CREDENTIALS" ]]; then
            echo "Secret ausente: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          promote_args=(--from-track "$PLAY_SOURCE_TRACK" --promote-track "$PLAY_TRACK" --release-status "$PLAY_RELEASE_STATUS" --version-code "${{ needs.version.outputs.code }}")
          if [[ "$PLAY_RELEASE_STATUS" == "IN_PROGRESS" ]]; then
            promote_args+=(--user-fraction "$PLAY_USER_FRACTION")
          fi
          ./gradlew promoteReleaseArtifact "${promote_args[@]}"
