name: Bug reproduzível
description: Relate um comportamento incorreto com passos verificáveis.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Não inclua números de telefone, nomes de contatos, tokens ou dumps. Para vulnerabilidades,
        use o [reporte privado](https://github.com/ricasolucoes/sentinela/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Versão do Sentinela
      placeholder: v0.2.1 ou commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Aparelho e Android
      placeholder: Samsung A54, Android 14
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Liste o menor caminho que reproduz o problema.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Removi números, nomes, tokens e outros dados pessoais.
          required: true
