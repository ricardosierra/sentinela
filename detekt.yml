# Configuração do detekt para o Sentinela (complementa os defaults).
# Regra de ouro do projeto: privacidade > conveniência.

build:
  maxIssues: 0

style:
  ReturnCount:
    # O CallDecisionEngine usa early-return por precedência — idioma correto para o domínio
    max: 5
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Composable', 'Preview']
  MaxLineLength:
    maxLineLength: 120

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
