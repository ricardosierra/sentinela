android.useAndroidX=true

# JDK 17 (Homebrew) — o Gradle não roda no JDK 25 do sistema; mesmo setup do dmconecta-app-client-android
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

# Memória do Gradle
# 1g de Metaspace e obrigatorio com o plugin Kover (Fase 2) — com 512m o build morre em "Failed to notify build listener > Metaspace"
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Otimizações de build
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
