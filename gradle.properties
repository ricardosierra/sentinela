android.useAndroidX=true


# Memória do Gradle
# 1g de Metaspace e obrigatorio com o plugin Kover (Fase 2) — com 512m o build morre em "Failed to notify build listener > Metaspace"
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Otimizações de build
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
