android.useAndroidX=true


# Memória do Gradle
# 1g de Metaspace e obrigatorio com o plugin Kover (Fase 2) — com 512m o build morre em "Failed to notify build listener > Metaspace"
#
# HeapDumpPath e obrigatorio junto com HeapDumpOnOutOfMemoryError: sem ele a JVM
# escreve java_pid<N>.hprof no diretorio de trabalho do daemon, que e a RAIZ do
# repositorio — foi assim que um dump de centenas de megabytes apareceu solto ao
# lado do build.gradle.kts. Apontar para build/ mantem o dump (ele e util para
# diagnosticar o proprio estouro de Metaspace acima) e o joga num diretorio que ja
# e ignorado pelo git e some no proximo `clean`.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build

# Otimizações de build
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
